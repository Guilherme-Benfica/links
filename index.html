<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Guilherme Benfica | Certificações Cloud</title>
  <meta name="description" content="Certificações AWS, Azure, Google Cloud, Oracle e GitHub, simulados na Udemy e conteúdo técnico de Guilherme Benfica.">
  <meta property="og:title" content="Guilherme Benfica | Certificações Cloud">
  <meta property="og:description" content="Certificações cloud, simulados e conteúdo técnico em um só lugar.">
  <meta property="og:type" content="profile">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">

    <header class="hero">
      <div class="avatar" aria-hidden="true">
        <span>GB</span>
        <img src="foto.jpg" alt="" onerror="this.remove()">
      </div>
      <h1>Guilherme Benfica</h1>
      <p class="headline">AWS Golden Jacket 🧥 · Certificações em AWS, Azure, Google Cloud, Oracle e GitHub</p>

      <div class="stats" id="stats"></div>

      <div class="actions">
        <a class="btn primary" id="btn-linkedin" href="https://www.linkedin.com/in/guilherme-benfica" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a class="btn" id="btn-credly" href="https://www.credly.com/users/guilherme-benfica/badges#credly" target="_blank" rel="noopener noreferrer">Credly</a>
        <a class="btn" href="https://builder.aws.com/community/@guilhermebenfica?tab=article" target="_blank" rel="noopener noreferrer">AWS Builder</a>
      </div>
    </header>

    <nav class="nav" id="nav" aria-label="Plataformas"></nav>

    <div id="providers"></div>
    <noscript>
      <p class="noscript">Ative o JavaScript para ver a lista completa ou acesse minhas credenciais no
        <a href="https://www.credly.com/users/guilherme-benfica/badges#credly">Credly</a>.</p>
    </noscript>

    <section class="provider content" id="conteudo">
      <div class="provider-head"><h2>Conteúdo</h2></div>
      <p class="tagline">Artigos técnicos sobre cloud</p>
      <div class="grid">
        <a class="cert has-udemy aws-accent" href="https://builder.aws.com/community/@guilhermebenfica?tab=article" target="_blank" rel="noopener noreferrer">
          <div class="cert-top"><span class="cert-code">AWS Builder</span></div>
          <div class="cert-name">Artigos sobre AWS</div>
          <span class="cta">Ler artigos &rarr;</span>
        </a>
        <!-- EM BREVE: descomente quando o Medium estiver no ar e troque SEU-USUARIO
        <a class="cert has-udemy azure-accent" href="https://medium.com/@SEU-USUARIO" target="_blank" rel="noopener noreferrer">
          <div class="cert-top"><span class="cert-code">Medium</span></div>
          <div class="cert-name">Artigos sobre Azure</div>
          <span class="cta">Ler artigos &rarr;</span>
        </a>
        -->
      </div>
    </section>

    <footer>© <span id="year"></span> Guilherme Benfica</footer>
  </main>

  <script src="certs.js"></script>
  <script src="app.js"></script>
</body>
</html>
